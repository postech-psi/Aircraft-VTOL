# Unit tests and pyflakes on every push and pull request. None of the tests need PX4 or Gazebo;
# the C++ force-model test compiles AeroPhysics.hh with the runner's g++.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.10: ROS 2 Humble on the Jetson. 3.12: the Ubuntu 24.04 simulation image.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pyflakes psi_vtol tests ros2 missions
      - run: python -m pytest -q
